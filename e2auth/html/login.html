<!DOCTYPE html>
<html lang="{{.HTMLLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
</head>
<body>
<main>
  <p>
    <a href="{{.LangURLZH}}"{{if eq .Lang "zh"}} aria-current="page"{{end}}>中文</a>
    ·
    <a href="{{.LangURLEN}}"{{if eq .Lang "en"}} aria-current="page"{{end}}>English</a>
  </p>
  <h1>{{.AppName}}</h1>
  <p>{{.T.SignIn}}</p>
  {{if .Notice}}<p>{{.Notice}}</p>{{end}}
  {{if .Error}}<p>{{.Error}}</p>{{end}}
  <form method="post" action="/auth/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="email">{{.T.Email}}</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">{{.T.Password}}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <label for="mfa_token">{{.T.MFA}}</label>
    <input id="mfa_token" name="mfa_token" inputmode="numeric" autocomplete="one-time-code">
    <button type="submit">{{.T.SubmitSignIn}}</button>
  </form>
  <nav>
    <a href="/auth/register">{{.T.Register}}</a> ·
    <a href="/auth/forgot-password">{{.T.ForgotPassword}}</a>
  </nav>
</main>
</body>
</html>
