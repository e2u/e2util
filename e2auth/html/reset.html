<!DOCTYPE html>
<html lang="{{.HTMLLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
</head>
<body>
<main>
  <p>
    <a href="{{.LangURLZH}}"{{if eq .Lang "zh"}} aria-current="page"{{end}}>中文</a>
    ·
    <a href="{{.LangURLEN}}"{{if eq .Lang "en"}} aria-current="page"{{end}}>English</a>
  </p>
  <h1>{{.AppName}}</h1>
  <p>{{.T.NewPassword}}</p>
  {{if .Error}}<p>{{.Error}}</p>{{end}}
  <form method="post" action="/auth/reset-password/confirm">
    <input type="hidden" name="token" value="{{.Token}}">
    <label for="password">{{.T.Password}}</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <p>{{.T.PasswordHint}}</p>
    <button type="submit">{{.T.UpdatePassword}}</button>
  </form>
  <nav><a href="/auth/login">{{.T.BackToSignIn}}</a></nav>
</main>
</body>
</html>
